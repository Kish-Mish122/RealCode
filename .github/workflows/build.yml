name: Build RealCode

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: RealCode-linux
          - os: windows-latest
            platform: windows
            artifact_name: RealCode-windows
          - os: macos-latest
            platform: macos
            artifact_name: RealCode-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install pyflakes pycodestyle pypresence packaging Pillow requests

      - name: Create config.py from secrets
        shell: python
        run: |
          import os
          with open("config.py", "w", encoding="utf-8") as f:
            f.write(os.environ["CONFIG_PY"])
        env:
          CONFIG_PY: ${{ secrets.CONFIG_PY }}

      - name: Build RealCode + CrashPad
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python build.py --${{ matrix.platform }}

      - name: Upload artifact (RealCode + CrashPad)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          # Загружаем ВСЮ папку с бинарниками — там и RealCode, и CrashPad
          path: |
            Linux_Bin/
            Windows_Bin/
            MacOS_Bin/
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release

          # ─── Windows ────────────────────────────────────────────
          find artifacts -name "RealCode.exe" \
              -path "*/Windows_Bin/*" \
              -exec cp {} release/RealCode-windows.exe \;
          find artifacts -name "RealCodeCrashPad.exe" \
              -path "*/Windows_Bin/*" \
              -exec cp {} release/RealCodeCrashPad-windows.exe \;

          # ─── Linux ──────────────────────────────────────────────
          find artifacts -name "RealCode" \
              -path "*/Linux_Bin/*" \
              -not -name "*CrashPad*" \
              -exec cp {} release/RealCode-linux \;
          find artifacts -name "RealCodeCrashPad" \
              -path "*/Linux_Bin/*" \
              -exec cp {} release/RealCodeCrashPad-linux \;
          chmod +x release/RealCode-linux || true
          chmod +x release/RealCodeCrashPad-linux || true

          # ─── macOS ──────────────────────────────────────────────
          find artifacts -name "RealCode" \
              -path "*/MacOS_Bin/*" \
              -not -name "*CrashPad*" \
              -exec cp {} release/RealCode-macos \;
          find artifacts -name "RealCodeCrashPad" \
              -path "*/MacOS_Bin/*" \
              -exec cp {} release/RealCodeCrashPad-macos \;
          chmod +x release/RealCode-macos || true
          chmod +x release/RealCodeCrashPad-macos || true

          echo "=== Файлы релиза ==="
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
